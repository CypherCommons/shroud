// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Read by some libraries. SDK, NDK and Kotlin versions come from Expo's version catalog
        // (applied by the expo-root-project plugin below).
        googlePlayServicesVersion = "16.+"
        googlePlayServicesIidVersion = "16.0.1"
        firebaseVersion = "17.3.4"
        firebaseMessagingVersion = "21.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
        classpath 'com.google.gms:google-services:4.5.0'  // Google Services plugin
        classpath("com.bugsnag:bugsnag-android-gradle-plugin:8.2.0")
    }
}

// Gradle 9 removed jcenter(), but react-native-secure-key-store and react-native-prompt-android
// still call it from their build.gradle. Point those calls at mavenCentral() instead.
def redirectJcenter = { RepositoryHandler repositories ->
    repositories.metaClass.jcenter = { -> delegate.mavenCentral() }
}
gradle.beforeProject { project ->
    redirectJcenter(project.repositories)
    redirectJcenter(project.buildscript.repositories)
}

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    afterEvaluate {project ->
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
            // FIXME: next line should be removed when https://github.com/wix/Detox/issues/4678 is fixed
            kotlinOptions.freeCompilerArgs += ["-Xopt-in=kotlin.ExperimentalStdlibApi"]
            if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                kotlinOptions.jvmTarget = android.compileOptions.sourceCompatibility
            } else {
                kotlinOptions.jvmTarget = sourceCompatibility
            }
        }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
