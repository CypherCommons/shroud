name: E2E Tests

# https://dev.to/edvinasbartkus/running-react-native-detox-tests-for-ios-and-android-on-github-actions-2ekn
# https://medium.com/@reime005/the-best-ci-cd-for-react-native-with-e2e-support-4860b4aaab29

env:
  TRAVIS: 1
  HD_MNEMONIC: ${{ secrets.HD_MNEMONIC }}
  MNEMONIC_TEST: ${{ secrets.MNEMONIC_TEST }}
  # The CI emulator is x86_64; building the other three ABIs (Rust + the RN/Fabric C++) was most of the build time.
  ANDROID_ABIS: x86_64

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE

# a newer push supersedes the run in flight
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: npm and gradle caches in /mnt
      run: |
        rm -rf ~/.npm
        rm -rf ~/.gradle
        sudo mkdir -p /mnt/.npm
        sudo mkdir -p /mnt/.gradle
        sudo chown -R runner /mnt/.npm
        sudo chown -R runner /mnt/.gradle
        ln -s /mnt/.npm /home/runner/
        ln -s /mnt/.gradle /home/runner/

    - name: Create artifacts directory on /mnt
      run: |
        sudo mkdir -p /mnt/artifacts
        sudo chown -R runner /mnt/artifacts

    - name: Specify node version
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: package-lock.json


    - name: Use gradle caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install node_modules
      run: npm ci --omit=dev --yes

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Use cargo caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust_jsi_bridge/target
        key: ${{ runner.os }}-cargo-${{ env.ANDROID_ABIS }}-${{ hashFiles('rust_jsi_bridge/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ env.ANDROID_ABIS }}-

    - name: Build Rust JSI bridge for Android
      run: npm run rust:build

    - name: Create .env for E2E
      run: cp .env.example .env

    - name: Build
      run: npm run e2e:release-build

    - name: Disk usage after build
      if: always()
      run: df -h / /mnt

    - name: Install dev deps needed for tests
      run: npm i

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        avd-name: Pixel_API_31
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2047
        arch: x86_64
        script: npm run e2e:release-test --  --record-videos failing --record-logs failing --take-screenshots failing --headless -d 200000 --retries 3 --artifacts-location /mnt/artifacts

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: e2e-test-videos
        path: /mnt/artifacts/
